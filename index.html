<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Water Sim · Voxel Fluid Sandbox</title>
  <meta name="description" content="A real-time 3D water sandbox: tens of thousands of tiny cubes simulated on your GPU with WebGPU. Shake the tank, make waves, splash and stir.">
  <meta name="theme-color" content="#070a12">
  <meta property="og:title" content="Water Sim · Voxel Fluid Sandbox">
  <meta property="og:description" content="Shake, tilt, splash and stir a tank of voxel water simulated live on your GPU.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>
  <canvas id="gpu-canvas" tabindex="0" aria-label="3D view of the water tank"></canvas>
  <div id="ui"></div>

  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-card">
      <div class="logo">
        <svg viewBox="0 0 40 40"><defs><linearGradient id="ilg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7be6ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient><linearGradient id="ilg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb6ff"/><stop offset="1" stop-color="#1638b8"/></linearGradient></defs><path d="M20 5 33 12.5v15L20 35 7 27.5v-15Z" fill="url(#ilg2)" opacity=".35"/><path d="M7 21.5c4.5-3 8.5-3 13 0s8.5 3 13 0v6L20 35 7 27.5Z" fill="url(#ilg1)"/><path d="M20 5 33 12.5v15L20 35 7 27.5v-15Z" fill="none" stroke="#bfefff" stroke-opacity=".8" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 12.5 20 20l13-7.5M20 20v15" fill="none" stroke="#bfefff" stroke-opacity=".35" stroke-width="1.2"/></svg>
      </div>
      <h2>Water Sim</h2>
      <p id="intro-status">Filling the tank…</p>
      <div class="intro-bar"><i></i></div>
    </div>
  </div>

  <div class="fallback" id="fallback" hidden>
    <div class="fallback-card">
      <svg viewBox="0 0 40 40" width="56" height="56" aria-hidden="true"><path d="M20 5 33 12.5v15L20 35 7 27.5v-15Z" fill="none" stroke="#8fb4ff" stroke-width="1.6" stroke-linejoin="round" opacity=".6"/><path d="M14 22c2-1.3 4-1.3 6 0s4 1.3 6 0" fill="none" stroke="#45c8ff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <h2></h2>
      <p></p>
      <code></code>
      <button class="btn" onclick="location.reload()">Reload</button>
    </div>
  </div>

  <noscript><div class="fallback"><div class="fallback-card"><h2>JavaScript required</h2><p>Water Sim runs entirely in your browser and needs JavaScript and WebGPU.</p></div></div></noscript>
  <script type="module" src="src/main.js"></script>

</html>
